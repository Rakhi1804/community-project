{% extends 'base.html' %}

{% block title %}Admin Login | Sir Kasturchand Daga Bal Sadan{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white text-center">
                <div class="icon-circle bg-primary-subtle text-primary mx-auto mb-3" style="width: 60px; height: 60px; font-size: 24px;">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h4 class="fw-bold text-dark mb-1">Bal Sadan Portal Login</h4>
                <p class="text-muted small mb-4">Administration access for Sir Kasturchand Daga Bal Sadan, Kamptee</p>

                <form method="POST" action="{{ url_for('admin') }}">
                    <div class="mb-3 text-start">
                        <label class="form-label small fw-semibold">Security Passcode / PIN</label>
                        <input type="password" name="admin_pin" class="form-control form-control-lg text-center fw-bold" placeholder="Enter PIN" required autofocus>
                        <small class="text-muted d-block text-center mt-2">Default PIN: <strong class="text-primary font-monospace">balsadan123</strong></small>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 rounded-pill fw-bold shadow-sm">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Unlock Dashboard
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
